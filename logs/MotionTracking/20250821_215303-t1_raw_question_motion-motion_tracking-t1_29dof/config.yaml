terrain:
  static_friction: 1.0
  dynamic_friction: 1.0
  restitution: 0.0
  mesh_type: plane
  horizontal_scale: 0.1
  vertical_scale: 0.005
  border_size: 40
  curriculum: false
  measure_heights: false
  measured_points_x:
  - 0.0
  measured_points_y:
  - 0.0
  selected: false
  terrain_kwargs: null
  max_init_terrain_level: 9
  terrain_length: 8.0
  terrain_width: 8.0
  num_rows: 10
  num_cols: 20
  terrain_types:
  - flat
  - rough
  - low_obst
  - smooth_slope
  - rough_slope
  terrain_proportions:
  - 0.2
  - 0.6
  - 0.2
  - 0.0
  - 0.0
  slope_treshold: 0.75
simulator:
  _target_: humanoidverse.simulator.isaacgym.isaacgym.IsaacGym
  _recursive_: false
  config:
    name: isaacgym
    terrain: ${terrain}
    sim:
      fps: 200
      control_decimation: 4
      substeps: 1
      physx:
        num_threads: 4
        solver_type: 1
        num_position_iterations: 4
        num_velocity_iterations: 0
        contact_offset: 0.01
        rest_offset: 0.0
        bounce_threshold_velocity: 0.5
        max_depenetration_velocity: 1.0
        default_buffer_size_multiplier: 5
        contact_collection: 2
obs:
